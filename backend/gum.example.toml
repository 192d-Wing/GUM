# GUM Backend Configuration
# Copy this file to gum.toml and edit as needed.
# Alternatively, set the GUM_CONFIG env var to point to your config file.

# ─── Server ───────────────────────────────────────────────────────────
# Address and port the backend listens on.
host = "0.0.0.0"
port = 4000

# ─── Database ─────────────────────────────────────────────────────────
# SQLite connection string. The "?mode=rwc" flag creates the file if missing.
database_url = "sqlite:gum.db?mode=rwc"

# ─── Session ──────────────────────────────────────────────────────────
# HMAC secret for signing session cookies.
# Generate a strong secret:  openssl rand -hex 32
# If left blank, a random secret is generated at startup (sessions won't
# survive restarts — fine for development, not for production).
session_secret = ""

# ─── Static Files (production) ────────────────────────────────────────
# Path to the built frontend assets (the output of `npm run build`).
# When set, the backend serves the SPA at "/" and static files from this
# directory, eliminating the need for a separate web server.
# Leave blank to disable (e.g., when using nginx or in development).
static_dir = ""

# ─── Health Polling ───────────────────────────────────────────────────
# Interval (in seconds) at which the backend polls each deployment's
# health endpoint. Set to 0 to disable polling.
health_poll_interval = 30

# ─── Security ────────────────────────────────────────────────────────
# Allowed CORS origins. When empty (default), all origins are allowed
# (suitable for development). In production, list your frontend URL(s).
# Example: allowed_origins = ["https://gum.example.com"]
allowed_origins = []

# Maximum request body size in bytes (default: 2 MiB = 2097152).
# The proxy endpoint uses its own 10 MiB limit regardless of this setting.
max_body_size = 2097152

# ─── Rate Limiting ──────────────────────────────────────────────────
# Maximum API requests per IP per window. Set to 0 to disable.
rate_limit = 100

# Rate limit window duration in seconds.
rate_limit_window = 60

# ─── OIDC / SSO ──────────────────────────────────────────────────────
# When OIDC is disabled (default), GUM runs in "stub auth" mode where
# all users are treated as an admin. Enable OIDC for real authentication.
[oidc]
enabled = false

# The OIDC issuer URL. Must serve a .well-known/openid-configuration endpoint.
# Examples:
#   Keycloak:  "https://keycloak.example.com/realms/gum"
#   Okta:      "https://dev-123456.okta.com"
#   Auth0:     "https://your-tenant.auth0.com/"
issuer_url = ""

# OAuth2 client credentials. Register GUM as a "confidential" client
# in your identity provider.
client_id = ""
client_secret = ""

# The callback URL — must exactly match what's configured in your IdP.
# For production, change to your real domain.
redirect_uri = "http://localhost:4000/api/v1/auth/oidc/callback"

# Space-separated list of scopes to request.
scopes = "openid profile email"

# The JWT claim that contains user roles.
# Common values:
#   Keycloak:    "realm_access.roles"  (nested claim)
#   Okta/Auth0:  "roles" or "groups"
roles_claim = "roles"
